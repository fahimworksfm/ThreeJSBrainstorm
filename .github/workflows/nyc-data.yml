# Downloads NYC Open Data for each neighborhood (building heights and years, street trees,
# restaurant grades) into public/nyc/ and commits it. Runs when the fetcher changes, monthly, or by hand.
name: NYC data

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 1 * *'
  push:
    paths:
      - .github/workflows/nyc-data.yml
      - scripts/fetch-nyc.mjs

permissions:
  contents: write

concurrency:
  group: nyc-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch from NYC Open Data
        run: |
          # into a scratch folder first; keep the old file for any neighborhood that fails
          mkdir -p /tmp/nyc public/nyc
          node scripts/fetch-nyc.mjs /tmp/nyc
          cp /tmp/nyc/*.json public/nyc/ 2>/dev/null || true
      - name: Commit
        run: |
          git config user.name "nyc-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/nyc
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update NYC Open Data ($(ls public/nyc | wc -l) neighborhoods)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
