<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
const dl = new DRACOLoader(); dl.setDecoderPath('/node_modules/three/examples/jsm/libs/draco/gltf/');
const out = [];
const r = new THREE.WebGLRenderer(); r.setSize(900, 500); document.body.append(r.domElement);

  out.push('  bones: ' + bones.join(' '));

  const s = 1.75 / box.getSize(new THREE.Vector3()).y; g.scene.scale.setScalar(s);
  g.scene.position.x = x; x += 2; scene.add(g.scene);
}

window.done = out.join('\n');
</script>
